<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f6fbfc" />
  
  <!-- Gradient overlay -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#g)" opacity="0.08" />
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  
  <!-- Main text content -->
  <g transform="translate(80,120)">
    <!-- Logo/Brand name -->
    <text x="0" y="0" font-family="Poppins, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#0f172a">
      Lumina Consulting
    </text>
    
    <!-- Tagline -->
    <text x="0" y="70" font-family="Inter, -apple-system, sans-serif" font-size="32" fill="#0f172a">
      Dukungan psikologi online
    </text>
    
    <!-- Main message -->
    <text x="0" y="160" font-family="Inter, -apple-system, sans-serif" font-size="44" fill="#0f172a" font-weight="600">
      Temukan psikolog yang tepat untuk Anda
    </text>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="1050" cy="120" r="60" fill="#60A5FA" opacity="0.1" />
  <circle cx="150" cy="550" r="80" fill="#7C3AED" opacity="0.1" />
</svg>
