baseURL = "https://lumina.consulting/insight/"
languageCode = "en-us"
title = "Lumina Insight"
enableRobotsTXT = true
publishDir = "../out/insight"
disableKinds = ["taxonomy", "term"]

[permalinks]
  articles = "/:slug/"

[markup]
