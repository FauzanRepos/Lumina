<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ block "title" . }}{{ if .IsHome }}Insight | Lumina Consulting{{ else }}{{ .Title }} | Lumina Insight{{ end }}{{ end }}</title>
    <meta name="description" content="{{ block "description" . }}{{ with .Params.description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}{{ end }}" />
    <link rel="stylesheet" href="{{ "styles/lumina.css" | relURL }}" />
  </head>
  <body>
    <div class="shell">
      <header class="site-header">
        <a class="brand-mark" href="/">Lumina</a>
        <nav class="site-nav" aria-label="Primary">
          <a href="/">Home</a>
          <a href="/psychologists/">Psychologists</a>
          <a href="/services/">Services</a>
          <a class="is-active" href="{{ "/" | relURL }}">Insights</a>
        </nav>
        <a class="header-cta" href="/psychologists/">Talk To A Psychologist</a>
      </header>

      {{ block "main" . }}{{ end }}

      <footer class="site-footer">
        <div>
          <p class="eyebrow">Lumina Insight</p>
          <h2>Warm reflection, clearer next steps.</h2>
        </div>
        <p>
          Editorial content for people who want something gentler than doomscrolling and more practical than generic wellness advice.
        </p>
      </footer>
    </div>
  </body>
</html>
